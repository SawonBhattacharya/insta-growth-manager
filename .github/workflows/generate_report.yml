name: Generate Instagram Report

on:
  workflow_dispatch:
    inputs:
      data_file:
        description: 'Select the data file to generate the report from'
        required: true
        type: choice
        options:
          # Add new .xlsx files here as you upload them.
          - 'data/insta monthly review.xlsx'
      model:
        description: 'Groq model to use (default: llama-3.1-8b-instant)'
        required: false
        default: 'llama-3.1-8b-instant'
        type: string
      dry_run:
        description: 'Parse and compute KPIs only - skip Groq API calls'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    name: Generate Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Validate selected data file.
      - name: Validate data file
        id: resolve
        run: |
          INPUT_FILE="${{ github.event.inputs.data_file }}"
          if [ ! -f "$INPUT_FILE" ]; then
            echo "::error::File not found: $INPUT_FILE"
            exit 1
          fi
          echo "Using: $INPUT_FILE"
          echo "excel_path=$INPUT_FILE" >> "$GITHUB_OUTPUT"

      # Generate report.
      - name: Generate report (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python -m insta_review \
            --excel "${{ steps.resolve.outputs.excel_path }}" \
            --dry-run \
            --out-dir outputs

      - name: Generate report (full)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m insta_review \
            --excel "${{ steps.resolve.outputs.excel_path }}" \
            --niche-context "insta_review/context/niche_context.md" \
            --strategist-prompt "insta_review/prompts/strategist_prompt.txt" \
            --content-prompt "insta_review/prompts/content_creator_prompt.txt" \
            --model "${{ github.event.inputs.model }}" \
            --out-dir outputs

      # Upload results.
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: instagram-report-${{ github.run_number }}
          path: outputs/report.html
          retention-days: 90
